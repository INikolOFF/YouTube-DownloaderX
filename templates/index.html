<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouTube Downloader X</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #6366f1;
            --primary-dark: #4f46e5;
            --secondary: #ec4899;
            --accent: #8b5cf6;
            --success: #10b981;
            --error: #ef4444;
            --warning: #f59e0b;
            --bg-dark: #0f172a;
            --bg-card: rgba(30, 41, 59, 0.7);
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --border: rgba(148, 163, 184, 0.1);
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg-dark);
            min-height: 100vh;
            color: var(--text-primary);
            overflow-x: hidden;
        }

        /* Animated Background */
        .bg-animation {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            background:
                radial-gradient(ellipse at 20% 20%, rgba(99, 102, 241, 0.15) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 80%, rgba(236, 72, 153, 0.15) 0%, transparent 50%),
                radial-gradient(ellipse at 50% 50%, rgba(139, 92, 246, 0.1) 0%, transparent 70%);
            animation: bgPulse 8s ease-in-out infinite;
        }

        @keyframes bgPulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        /* Header */
        .header {
            text-align: center;
            margin-bottom: 50px;
            animation: slideDown 0.8s ease-out;
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .logo {
            display: inline-flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 20px;
        }

        .logo-icon {
            width: 60px;
            height: 60px;
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            box-shadow: 0 10px 40px rgba(99, 102, 241, 0.4);
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        .header h1 {
            font-size: 3em;
            font-weight: 800;
            background: linear-gradient(135deg, #fff 0%, #a5b4fc 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: -0.02em;
        }

        .header p {
            font-size: 1.2em;
            color: var(--text-secondary);
            font-weight: 300;
        }

        /* Cards */
        .card {
            background: var(--bg-card);
            backdrop-filter: blur(20px);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 35px;
            margin-bottom: 30px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            animation: slideUp 0.8s ease-out;
            animation-fill-mode: both;
        }

        .card:nth-child(2) { animation-delay: 0.1s; }
        .card:nth-child(3) { animation-delay: 0.2s; }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(40px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .section-title {
            font-size: 1.4em;
            font-weight: 700;
            margin-bottom: 25px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .section-title::before {
            content: '';
            width: 4px;
            height: 24px;
            background: linear-gradient(180deg, var(--primary) 0%, var(--secondary) 100%);
            border-radius: 2px;
        }

        /* Form Elements */
        .form-group {
            margin-bottom: 24px;
        }

        .form-group label {
            display: block;
            margin-bottom: 10px;
            font-weight: 500;
            color: var(--text-secondary);
            font-size: 0.95em;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .input-wrapper {
            position: relative;
        }

        .form-group input[type="text"],
        .form-group select {
            width: 100%;
            padding: 16px 20px;
            background: rgba(15, 23, 42, 0.6);
            border: 2px solid var(--border);
            border-radius: 12px;
            font-size: 16px;
            color: var(--text-primary);
            transition: all 0.3s ease;
            font-family: inherit;
        }

        .form-group input[type="text"]:focus,
        .form-group select:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.1);
            background: rgba(15, 23, 42, 0.8);
        }

        .form-group input[type="text"]::placeholder {
            color: var(--text-secondary);
            opacity: 0.6;
        }

        /* Custom Select */
        .select-wrapper {
            position: relative;
        }

        .select-wrapper::after {
            content: '▼';
            position: absolute;
            right: 20px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--primary);
            font-size: 12px;
            pointer-events: none;
        }

        .form-group select {
            appearance: none;
            cursor: pointer;
        }

        .form-group select option {
            background: var(--bg-dark);
            color: var(--text-primary);
        }

        /* Checkboxes */
        .checkbox-group {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 16px;
            margin-bottom: 30px;
        }

        .checkbox-wrapper {
            position: relative;
        }

        .checkbox-wrapper input[type="checkbox"] {
            position: absolute;
            opacity: 0;
            cursor: pointer;
        }

        .checkbox-label {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 16px 20px;
            background: rgba(15, 23, 42, 0.4);
            border: 2px solid var(--border);
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 0.95em;
            color: var(--text-secondary);
        }

        .checkbox-wrapper input[type="checkbox"]:checked + .checkbox-label {
            border-color: var(--primary);
            background: rgba(99, 102, 241, 0.1);
            color: var(--text-primary);
        }

        .checkbox-custom {
            width: 22px;
            height: 22px;
            border: 2px solid var(--text-secondary);
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            flex-shrink: 0;
        }

        .checkbox-wrapper input[type="checkbox"]:checked + .checkbox-label .checkbox-custom {
            background: var(--primary);
            border-color: var(--primary);
        }

        .checkbox-custom::after {
            content: '✓';
            color: white;
            font-size: 14px;
            font-weight: bold;
            opacity: 0;
            transform: scale(0);
            transition: all 0.2s ease;
        }

        .checkbox-wrapper input[type="checkbox"]:checked + .checkbox-label .checkbox-custom::after {
            opacity: 1;
            transform: scale(1);
        }

        /* Button */
        .btn {
            width: 100%;
            padding: 18px;
            background: linear-gradient(135deg, var(--primary) 0%, var(--accent) 100%);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            font-family: inherit;
            letter-spacing: 0.02em;
        }

        .btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
            transition: left 0.5s;
        }

        .btn:hover::before {
            left: 100%;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 20px 40px rgba(99, 102, 241, 0.4);
        }

        .btn:active {
            transform: translateY(0);
        }

        .btn:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            transform: none;
        }

        .btn-content {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .spinner {
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255,255,255,0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            display: none;
        }

        .btn.loading .spinner {
            display: inline-block;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Progress Section */
        .progress-section {
            margin-top: 30px;
            padding-top: 30px;
            border-top: 1px solid var(--border);
            display: none;
            animation: fadeIn 0.5s ease;
        }

        .progress-section.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .progress-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .progress-title {
            font-weight: 600;
            color: var(--text-primary);
        }

        .progress-percentage {
            font-size: 1.5em;
            font-weight: 800;
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .progress-bar-container {
            width: 100%;
            height: 12px;
            background: rgba(15, 23, 42, 0.6);
            border-radius: 10px;
            overflow: hidden;
            position: relative;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.3);
        }

        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, var(--primary) 0%, var(--secondary) 50%, var(--accent) 100%);
            background-size: 200% 100%;
            width: 0%;
            border-radius: 10px;
            transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            animation: shimmer 2s linear infinite;
        }

        @keyframes shimmer {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }

        .progress-bar::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
            animation: progressGlow 2s ease-in-out infinite;
        }

        @keyframes progressGlow {
            0%, 100% { opacity: 0; }
            50% { opacity: 1; }
        }

        .progress-details {
            display: flex;
            justify-content: space-between;
            margin-top: 15px;
            font-size: 0.9em;
            color: var(--text-secondary);
        }

        .progress-stat {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .progress-stat strong {
            color: var(--text-primary);
            font-weight: 600;
        }

        /* Status Messages */
        .status-message {
            margin-top: 20px;
            padding: 16px 20px;
            border-radius: 12px;
            display: none;
            align-items: center;
            gap: 12px;
            animation: slideIn 0.4s ease;
        }

        .status-message.show {
            display: flex;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateX(-20px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .status-message.success {
            background: rgba(16, 185, 129, 0.1);
            border: 1px solid var(--success);
            color: var(--success);
        }

        .status-message.error {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid var(--error);
            color: var(--error);
        }

        /* History */
        .history-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .badge {
            background: var(--primary);
            color: white;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.85em;
            font-weight: 600;
        }

        .history-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .history-item {
            background: rgba(15, 23, 42, 0.4);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 20px;
            display: grid;
            grid-template-columns: auto 1fr auto;
            gap: 16px;
            align-items: center;
            transition: all 0.3s ease;
            animation: fadeIn 0.5s ease;
        }

        .history-item:hover {
            background: rgba(15, 23, 42, 0.6);
            border-color: rgba(99, 102, 241, 0.3);
            transform: translateX(5px);
        }

        .history-icon {
            width: 48px;
            height: 48px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            flex-shrink: 0;
        }

        .history-icon.completed {
            background: rgba(16, 185, 129, 0.2);
            color: var(--success);
        }

        .history-icon.error {
            background: rgba(239, 68, 68, 0.2);
            color: var(--error);
        }

        .history-icon.downloading {
            background: rgba(99, 102, 241, 0.2);
            color: var(--primary);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .history-info {
            min-width: 0;
        }

        .history-title {
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 6px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .history-meta {
            font-size: 0.85em;
            color: var(--text-secondary);
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        .history-meta span {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .history-status {
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.8em;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .history-status.completed {
            background: rgba(16, 185, 129, 0.15);
            color: var(--success);
        }

        .history-status.error {
            background: rgba(239, 68, 68, 0.15);
            color: var(--error);
        }

        .history-status.downloading {
            background: rgba(99, 102, 241, 0.15);
            color: var(--primary);
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-secondary);
        }

        .empty-state-icon {
            font-size: 48px;
            margin-bottom: 16px;
            opacity: 0.5;
        }

        .empty-state-text {
            font-size: 1.1em;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .container {
                padding: 20px 15px;
            }

            .header h1 {
                font-size: 2em;
            }

            .card {
                padding: 24px;
                border-radius: 20px;
            }

            .history-item {
                grid-template-columns: 1fr;
                text-align: center;
            }

            .history-icon {
                margin: 0 auto;
            }

            .history-meta {
                justify-content: center;
            }
        }

        /* Scrollbar */
        ::-webkit-scrollbar {
            width: 10px;
        }

        ::-webkit-scrollbar-track {
            background: var(--bg-dark);
        }

        ::-webkit-scrollbar-thumb {
            background: var(--primary);
            border-radius: 5px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: var(--primary-dark);
        }
    </style>
<base target="_blank">
</head>
<body>
    <div class="bg-animation"></div>

    <div class="container">
        <!-- Header -->
        <div class="header">
            <div class="logo">
                <div class="logo-icon">⬇️</div>
                <h1>Downloader X</h1>
            </div>
            <p>Fast. Simple. Beautiful.</p>
        </div>

        <!-- Download Form -->
        <div class="card">
            <h2 class="section-title">New Download</h2>
            <form id="downloadForm">
                <div class="form-group">
                    <label for="url">Video URL</label>
                    <div class="input-wrapper">
                        <input type="text" id="url" name="url" placeholder="https://youtube.com/watch?v=..." required autocomplete="off">
                    </div>
                </div>

                <div class="form-group">
                    <label for="format">Quality & Format</label>
                    <div class="select-wrapper">
                        <select id="format" name="format">
                            <option value="1">🎬 Video (MP4) - Best Quality</option>
                            <option value="2">🎵 Audio (MP3) - 192 kbps</option>
                            <option value="3">🎵 Audio (M4A) - Original Quality</option>
                            <option value="4">🎵 Audio (WAV) - Lossless</option>
                        </select>
                    </div>
                </div>

                <div class="checkbox-group">
                    <div class="checkbox-wrapper">
                        <input type="checkbox" id="archive" name="archive" checked>
                        <label for="archive" class="checkbox-label">
                            <span class="checkbox-custom"></span>
                            <span>Skip duplicates by ID</span>
                        </label>
                    </div>
                    <div class="checkbox-wrapper">
                        <input type="checkbox" id="duplicate_check" name="duplicate_check" checked>
                        <label for="duplicate_check" class="checkbox-label">
                            <span class="checkbox-custom"></span>
                            <span>Check file hashes</span>
                        </label>
                    </div>
                </div>

                <button type="submit" class="btn" id="downloadBtn">
                    <span class="btn-content">
                        <span class="spinner"></span>
                        <span>Start Download</span>
                    </span>
                </button>
            </form>

            <!-- Progress Section -->
            <div class="progress-section" id="progressSection">
                <div class="progress-header">
                    <span class="progress-title">Downloading...</span>
                    <span class="progress-percentage" id="progressPercent">0%</span>
                </div>
                <div class="progress-bar-container">
                    <div class="progress-bar" id="progressBar"></div>
                </div>
                <div class="progress-details">
                    <span class="progress-stat" id="progressSize">-- / --</span>
                    <span class="progress-stat" id="progressSpeed">⚡ --</span>
                    <span class="progress-stat" id="progressETA">⏱️ --</span>
                </div>
            </div>

            <div class="status-message" id="statusMessage"></div>
        </div>

        <!-- Download History -->
        <div class="card">
            <div class="history-header">
                <h2 class="section-title">Recent Downloads</h2>
                <span class="badge" id="historyCount">0</span>
            </div>
            <div id="historyContainer">
                <div class="empty-state">
                    <div class="empty-state-icon">📭</div>
                    <div class="empty-state-text">No downloads yet. Start by adding a URL above!</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let currentDownloadId = null;
        let progressInterval = null;

        // Form submission
        document.getElementById('downloadForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const url = document.getElementById('url').value.trim();
            const format = document.getElementById('format').value;
            const archive = document.getElementById('archive').checked;
            const duplicate_check = document.getElementById('duplicate_check').checked;

            if (!url) return;

            // UI State
            const btn = document.getElementById('downloadBtn');
            btn.classList.add('loading');
            btn.disabled = true;

            // Hide previous status
            document.getElementById('statusMessage').classList.remove('show');

            // Show progress
            document.getElementById('progressSection').classList.add('active');
            updateProgress({percent: 0, status: 'starting'});

            try {
                const response = await fetch('/download', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ url, format, archive, duplicate_check })
                });

                const data = await response.json();

                if (response.ok) {
                    currentDownloadId = data.download_id;
                    startProgressTracking();
                } else {
                    showError(data.error || 'Failed to start download');
                    resetForm();
                }
            } catch (error) {
                showError('Network error. Please try again.');
                resetForm();
            }
        });

        function startProgressTracking() {
            progressInterval = setInterval(async () => {
                try {
                    const response = await fetch(`/progress/${currentDownloadId}`);
                    const data = await response.json();

                    if (response.ok) {
                        updateProgress(data);

                        if (data.status === 'completed') {
                            clearInterval(progressInterval);
                            showSuccess(data.title || 'Download completed!');
                            setTimeout(() => {
                                resetForm();
                                loadHistory();
                            }, 2000);
                        } else if (data.status === 'error') {
                            clearInterval(progressInterval);
                            showError(data.error || 'Download failed');
                            setTimeout(() => {
                                resetForm();
                                loadHistory();
                            }, 3000);
                        }
                    }
                } catch (error) {
                    console.error('Progress error:', error);
                }
            }, 800);
        }

        function updateProgress(data) {
            const percent = Math.round(data.percent || 0);
            const bar = document.getElementById('progressBar');
            const percentText = document.getElementById('progressPercent');

            bar.style.width = percent + '%';
            percentText.textContent = percent + '%';

            // Update details
            if (data.status === 'downloading') {
                document.getElementById('progressSize').innerHTML = `💾 <strong>${data.downloaded || '--'}</strong> / ${data.total || '--'}`;
                document.getElementById('progressSpeed').innerHTML = `⚡ <strong>${data.speed || '--'}</strong>`;
                document.getElementById('progressETA').innerHTML = `⏱️ <strong>${data.eta || '--'}</strong>`;
                document.querySelector('.progress-title').textContent = 'Downloading...';
            } else if (data.status === 'completed') {
                document.querySelector('.progress-title').textContent = '✓ Complete!';
                document.getElementById('progressSpeed').innerHTML = '⚡ <strong>Done</strong>';
                document.getElementById('progressETA').innerHTML = '⏱️ <strong>0s</strong>';
            } else if (data.status === 'error') {
                document.querySelector('.progress-title').textContent = '✗ Error';
                bar.style.background = 'var(--error)';
            }
        }

        function showSuccess(message) {
            const el = document.getElementById('statusMessage');
            el.className = 'status-message success show';
            el.innerHTML = `✓ ${message}`;
        }

        function showError(message) {
            const el = document.getElementById('statusMessage');
            el.className = 'status-message error show';
            el.innerHTML = `✗ ${message}`;
        }

        function resetForm() {
            const btn = document.getElementById('downloadBtn');
            btn.classList.remove('loading');
            btn.disabled = false;

            document.getElementById('progressSection').classList.remove('active');
            document.getElementById('progressBar').style.width = '0%';
            document.getElementById('progressBar').style.background = '';
            document.getElementById('url').value = '';
            currentDownloadId = null;
        }

        async function loadHistory() {
            try {
                const response = await fetch('/history');
                const history = await response.json();

                const container = document.getElementById('historyContainer');
                const countBadge = document.getElementById('historyCount');

                countBadge.textContent = history.length;

                if (history.length === 0) {
                    container.innerHTML = `
                        <div class="empty-state">
                            <div class="empty-state-icon">📭</div>
                            <div class="empty-state-text">No downloads yet. Start by adding a URL above!</div>
                        </div>
                    `;
                    return;
                }

                const formatMap = {
                    '1': 'Video (MP4)',
                    '2': 'Audio (MP3)',
                    '3': 'Audio (M4A)',
                    '4': 'Audio (WAV)'
                };

                container.innerHTML = '<div class="history-list">' +
                    history.slice().reverse().map(item => {
                        const isCompleted = item.status === 'completed';
                        const isError = item.status === 'error';
                        const icon = isCompleted ? '✓' : isError ? '✗' : '⏳';
                        const statusClass = isCompleted ? 'completed' : isError ? 'error' : 'downloading';

                        return `
                            <div class="history-item">
                                <div class="history-icon ${statusClass}">${icon}</div>
                                <div class="history-info">
                                    <div class="history-title" title="${item.title || item.url}">${item.title || item.url}</div>
                                    <div class="history-meta">
                                        <span>🎬 ${formatMap[item.format] || item.format || 'Unknown'}</span>
                                        <span>🕐 ${item.timestamp}</span>
                                    </div>
                                </div>
                                <span class="history-status ${statusClass}">${item.status}</span>
                            </div>
                        `;
                    }).join('') +
                '</div>';
            } catch (error) {
                console.error('History error:', error);
            }
        }

        // Initial load
        loadHistory();

        // Refresh every 5 seconds
        setInterval(loadHistory, 5000);
    </script>
</body>
</html>
