<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouTube Downloader X - Web Interface</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 40px;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .header p {
            font-size: 1.1em;
            opacity: 0.9;
        }

        .card {
            background: white;
            border-radius: 16px;
            padding: 30px;
            margin-bottom: 20px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #333;
        }

        .form-group input[type="text"],
        .form-group select {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s;
        }

        .form-group input[type="text"]:focus,
        .form-group select:focus {
            outline: none;
            border-color: #667eea;
        }

        .checkbox-group {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
        }

        .checkbox-group label {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            font-size: 14px;
        }

        .checkbox-group input[type="checkbox"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
        }

        .btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }

        .btn:active {
            transform: translateY(0);
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .progress-section {
            display: none;
            margin-top: 20px;
        }

        .progress-section.active {
            display: block;
        }

        .progress-bar-container {
            width: 100%;
            height: 30px;
            background: #f0f0f0;
            border-radius: 15px;
            overflow: hidden;
            margin-bottom: 10px;
        }

        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
            width: 0%;
            transition: width 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 600;
            font-size: 14px;
        }

        .progress-info {
            display: flex;
            justify-content: space-between;
            font-size: 14px;
            color: #666;
        }

        .status-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 600;
        }

        .status-completed {
            background: #d4edda;
            color: #155724;
        }

        .status-downloading {
            background: #cce5ff;
            color: #004085;
        }

        .status-error {
            background: #f8d7da;
            color: #721c24;
        }

        .history-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        .history-table th,
        .history-table td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #e0e0e0;
        }

        .history-table th {
            background: #f8f9fa;
            font-weight: 600;
            color: #333;
        }

        .history-table tr:hover {
            background: #f8f9fa;
        }

        .empty-state {
            text-align: center;
            padding: 40px;
            color: #999;
        }

        .section-title {
            font-size: 1.5em;
            margin-bottom: 20px;
            color: #333;
        }

        @media (max-width: 768px) {
            .header h1 {
                font-size: 1.8em;
            }

            .card {
                padding: 20px;
            }

            .checkbox-group {
                flex-direction: column;
                gap: 10px;
            }

            .history-table {
                font-size: 14px;
            }

            .history-table th,
            .history-table td {
                padding: 8px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎬 YouTube Downloader X</h1>
            <p>Remote Web Interface</p>
        </div>

        <!-- Download Form -->
        <div class="card">
            <h2 class="section-title">Download Video</h2>
            <form id="downloadForm">
                <div class="form-group">
                    <label for="url">YouTube URL</label>
                    <input type="text" id="url" name="url" placeholder="https://www.youtube.com/watch?v=..." required>
                </div>

                <div class="form-group">
                    <label for="format">Format</label>
                    <select id="format" name="format">
                        <option value="1">Video (MP4) - Best Quality</option>
                        <option value="2">Audio (MP3) - 192 kbps</option>
                        <option value="3">Audio (M4A) - Original Quality</option>
                        <option value="4">Audio (WAV) - Lossless</option>
                    </select>
                </div>

                <div class="checkbox-group">
                    <label>
                        <input type="checkbox" id="archive" name="archive" checked>
                        <span>Archive Mode (Skip duplicates by ID)</span>
                    </label>
                    <label>
                        <input type="checkbox" id="duplicate_check" name="duplicate_check" checked>
                        <span>Duplicate Detection (Compare file hashes)</span>
                    </label>
                </div>

                <button type="submit" class="btn" id="downloadBtn">Start Download</button>
            </form>

            <!-- Progress Section -->
            <div class="progress-section" id="progressSection">
                <div class="progress-bar-container">
                    <div class="progress-bar" id="progressBar">0%</div>
                </div>
                <div class="progress-info">
                    <span id="progressStatus">Preparing download...</span>
                    <span id="progressSpeed">--</span>
                </div>
            </div>
        </div>

        <!-- Download History -->
        <div class="card">
            <h2 class="section-title">Download History</h2>
            <div id="historyContainer">
                <div class="empty-state">No downloads yet</div>
            </div>
        </div>
    </div>

    <script>
        let currentDownloadId = null;
        let progressInterval = null;

        // Form submission
        document.getElementById('downloadForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const url = document.getElementById('url').value;
            const format = document.getElementById('format').value;
            const archive = document.getElementById('archive').checked;
            const duplicate_check = document.getElementById('duplicate_check').checked;

            // Disable button
            const btn = document.getElementById('downloadBtn');
            btn.disabled = true;
            btn.textContent = 'Starting...';

            // Show progress section
            const progressSection = document.getElementById('progressSection');
            progressSection.classList.add('active');

            try {
                const response = await fetch('/download', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        url,
                        format,
                        archive,
                        duplicate_check
                    })
                });

                const data = await response.json();

                if (response.ok) {
                    currentDownloadId = data.download_id;
                    startProgressTracking();
                } else {
                    alert('Error: ' + (data.error || 'Unknown error'));
                    resetForm();
                }
            } catch (error) {
                alert('Error: ' + error.message);
                resetForm();
            }
        });

        // Track download progress
        function startProgressTracking() {
            progressInterval = setInterval(async () => {
                try {
                    const response = await fetch(`/progress/${currentDownloadId}`);
                    const data = await response.json();

                    updateProgress(data);

                    if (data.status === 'completed' || data.status === 'error') {
                        clearInterval(progressInterval);
                        setTimeout(() => {
                            resetForm();
                            loadHistory();
                        }, 2000);
                    }
                } catch (error) {
                    console.error('Error fetching progress:', error);
                }
            }, 500);
        }

        // Update progress UI
        function updateProgress(data) {
            const progressBar = document.getElementById('progressBar');
            const progressStatus = document.getElementById('progressStatus');
            const progressSpeed = document.getElementById('progressSpeed');

            if (data.status === 'downloading') {
                const percent = Math.round(data.percent);
                progressBar.style.width = percent + '%';
                progressBar.textContent = percent + '%';
                progressStatus.textContent = `${data.downloaded} / ${data.total}`;
                progressSpeed.textContent = `Speed: ${data.speed} | ETA: ${data.eta}`;
            } else if (data.status === 'completed') {
                progressBar.style.width = '100%';
                progressBar.textContent = '✓ Completed';
                progressStatus.textContent = data.title || 'Download completed';
                progressSpeed.textContent = '';
            } else if (data.status === 'error') {
                progressBar.style.background = '#dc3545';
                progressBar.textContent = '✗ Error';
                progressStatus.textContent = data.error || 'Download failed';
                progressSpeed.textContent = '';
            }
        }

        // Reset form
        function resetForm() {
            const btn = document.getElementById('downloadBtn');
            btn.disabled = false;
            btn.textContent = 'Start Download';

            const progressSection = document.getElementById('progressSection');
            progressSection.classList.remove('active');

            const progressBar = document.getElementById('progressBar');
            progressBar.style.width = '0%';
            progressBar.textContent = '0%';
            progressBar.style.background = 'linear-gradient(90deg, #667eea 0%, #764ba2 100%)';

            document.getElementById('url').value = '';
            currentDownloadId = null;
        }

        // Load download history
        async function loadHistory() {
            try {
                const response = await fetch('/history');
                const history = await response.json();

                const container = document.getElementById('historyContainer');

                if (history.length === 0) {
                    container.innerHTML = '<div class="empty-state">No downloads yet</div>';
                    return;
                }

                let html = '<table class="history-table"><thead><tr>';
                html += '<th>Title</th><th>Format</th><th>Status</th><th>Time</th>';
                html += '</tr></thead><tbody>';

                history.reverse().forEach(item => {
                    const statusClass = item.status === 'completed' ? 'status-completed' :
                                      item.status === 'error' ? 'status-error' : 'status-downloading';

                    html += '<tr>';
                    html += `<td>${item.title || item.url.substring(0, 50) + '...'}</td>`;
                    html += `<td>${item.format || '--'}</td>`;
                    html += `<td><span class="status-badge ${statusClass}">${item.status}</span></td>`;
                    html += `<td>${item.timestamp}</td>`;
                    html += '</tr>';
                });

                html += '</tbody></table>';
                container.innerHTML = html;
            } catch (error) {
                console.error('Error loading history:', error);
            }
        }

        // Load history on page load
        loadHistory();

        // Refresh history every 5 seconds
        setInterval(loadHistory, 5000);
    </script>
</body>
</html>
